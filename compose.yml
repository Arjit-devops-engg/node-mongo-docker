services:

  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      nodeapp:
        condition: service_healthy

    networks:
      - frontend-network

    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  nodeapp:
    build: .

    environment:
      PORT: ${PORT}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      DB_NAME: ${DB_NAME}

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      frontend-network:
        aliases:
          - api
      backend-network:

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  mongodb:
    image: mongo:8

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    volumes:
      - mongo-data:/data/db

    networks:
      - backend-network

    healthcheck:
      test:
        - CMD
        - mongosh
        - --username
        - ${MONGO_USERNAME}
        - --password
        - ${MONGO_PASSWORD}
        - --authenticationDatabase
        - admin
        - --eval
        - db.adminCommand('ping')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


networks:

  frontend-network:

  backend-network:


volumes:

  mongo-data: